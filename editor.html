<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel</title>
    <link rel="stylesheet" href="editorStyle.css">
</head>

<body>
    <div class='field-container'>
        <div class='color-palette'>
            <div class='color-cell red'></div>

            <div class='color-cell light-blue'></div>

            <div class='tool-cell eraser'>

                <img src='https://cdn-icons-png.flaticon.com/512/3580/3580085.png'>
            </div>
            <div class="back">
                <a href="index.html"><img src="https://cdn-icons-png.flaticon.com/512/3545/3545314.png"></a>
            </div>
        </div>
        <div class='field'></div>
    </div>
    <script src='script.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
